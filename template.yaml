AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Grocery List Twilio webhook + MCP server on Lambda + API Gateway + DynamoDB

Parameters:
  DomainName:
    Type: String
    Default: grocerylist.vezcore.com
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for vezcore.com
  AcmCertificateArn:
    Type: String
    Description: ARN of the ACM certificate for grocerylist.vezcore.com (must be pre-validated)

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 29
    MemorySize: 256
    Environment:
      Variables:
        TENANTS_TABLE: !Ref GroceryTenantsTable
        LISTS_TABLE: !Ref GroceryListsTable

Resources:

  # ── Lambda ──────────────────────────────────────────────────────────────────

  GroceryListFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: grocery-list-twilio
      CodeUri: .
      Handler: twilio.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref GroceryTenantsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref GroceryListsTable
        - SSMParameterReadPolicy:
            ParameterName: grocerylist/*
      Events:
        SmsWebhook:
          Type: HttpApi
          Properties:
            Path: /sms
            Method: POST
            ApiId: !Ref GroceryListApi
        McpEndpoint:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: ANY
            ApiId: !Ref GroceryListApi
        OAuthToken:
          Type: HttpApi
          Properties:
            Path: /oauth/token
            Method: POST
            ApiId: !Ref GroceryListApi
        OAuthAuthorizeGet:
          Type: HttpApi
          Properties:
            Path: /oauth/authorize
            Method: GET
            ApiId: !Ref GroceryListApi
        OAuthAuthorizePost:
          Type: HttpApi
          Properties:
            Path: /oauth/authorize
            Method: POST
            ApiId: !Ref GroceryListApi
        OAuthMetadata:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-authorization-server
            Method: GET
            ApiId: !Ref GroceryListApi
        OAuthProtectedResource:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-protected-resource/mcp
            Method: GET
            ApiId: !Ref GroceryListApi

  # ── API Gateway ──────────────────────────────────────────────────────────────

  GroceryListApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  GroceryListDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref AcmCertificateArn
          EndpointType: REGIONAL

  GroceryListApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn:
      - GroceryListDomainName
      - GroceryListApiApiGatewayDefaultStage
    Properties:
      DomainName: !Ref DomainName
      ApiId: !Ref GroceryListApi
      Stage: $default

  # ── Route 53 ─────────────────────────────────────────────────────────────────

  GroceryListDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt GroceryListDomainName.RegionalDomainName
        HostedZoneId: !GetAtt GroceryListDomainName.RegionalHostedZoneId
        EvaluateTargetHealth: false

  # ── DynamoDB ──────────────────────────────────────────────────────────────────

  GroceryTenantsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: GroceryTenants
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: mcpApiKeyHash
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: mcpApiKeyHash-index
          KeySchema:
            - AttributeName: mcpApiKeyHash
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  GroceryListsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: GroceryLists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: listId
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH
        - AttributeName: listId
          KeyType: RANGE

Outputs:
  ApiEndpoint:
    Description: Default API Gateway endpoint
    Value: !Sub 'https://${GroceryListApi}.execute-api.${AWS::Region}.amazonaws.com/sms'
  CustomDomainEndpoint:
    Description: Custom domain SMS endpoint
    Value: !Sub 'https://${DomainName}/sms'
  McpEndpoint:
    Description: MCP server endpoint for ChatGPT integration
    Value: !Sub 'https://${DomainName}/mcp'
  GroceryListFunctionArn:
    Value: !GetAtt GroceryListFunction.Arn
